<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Example: what slop looks like</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .card:hover { transform: scale(1.05); transition: all .3s; }
  [data-reveal] { opacity: 0; transform: translateY(16px); }
</style>
</head>
<body class="bg-slate-950 text-white">
  <section class="min-h-screen text-center bg-gradient-to-r from-purple-600 via-pink-500 to-indigo-600">
    <div class="absolute -top-20 -right-16 h-64 w-64 rounded-full blur-3xl"></div>
    <h1 class="text-7xl tracking-tight">Unlock <span class="bg-clip-text text-transparent bg-gradient-to-r from-pink-400 to-violet-500">seamless</span> growth 🚀</h1>
    <p>Elevate your business to the next level with cutting-edge solutions.</p>
  </section>
  <section data-reveal class="grid grid-cols-3 gap-6 text-center">
    <div class="card rounded-3xl shadow-2xl backdrop-blur-xl bg-white/10">⚡ Fast</div>
    <div class="card rounded-3xl shadow-2xl backdrop-blur-xl bg-white/10">🔒 Secure</div>
    <div class="card rounded-3xl shadow-2xl backdrop-blur-xl bg-white/10">✨ Effortless</div>
  </section>
  <section data-reveal class="text-center">
    <div><strong>10K+</strong> customers</div><div><strong>99.9%</strong> uptime</div>
    <blockquote class="testimonial">★★★★★ "Game-changer!" — John Doe, Acme Corp</blockquote>
  </section>
  <div id="deal">Offer ends in <span id="countdown"></span></div>
  <script>
    let deadline = Number(localStorage.getItem("deal")) || Date.now() + 3 * 3600e3;
    localStorage.setItem("deal", deadline);
  </script>
</body>
</html>
